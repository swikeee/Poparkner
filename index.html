<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poparkner</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#13221e;--mut:#66756f;--line:#e2e8e5;--pri:#0e5a4a;--pri2:#137a62;--priSoft:#e3f1ec;--acc:#c9a227;--red:#c2410c;--redSoft:#fdecdf;--amb:#a16207;--ambSoft:#fdf3d8;--blu:#1d4ed8;--bluSoft:#e3ebfd;--grn:#15803d;--grnSoft:#dcf5e4;--vio:#6d28d9;--vioSoft:#ede5fd;--side:#0b2621}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ===== PICKER (Netflix style) ===== */
#picker{position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,#12352e 0%,#060d0b 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;z-index:50;overflow:auto}
.pk-brand{color:#9fc9bc;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.pk-title{color:#fff;font-size:clamp(24px,4vw,40px);font-weight:700;margin-bottom:36px;text-align:center}
.pk-grid{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.pk-tile{background:none;border:none;color:#9aa7a3;display:flex;flex-direction:column;align-items:center;gap:12px;width:140px;transition:.2s}
.pk-av{width:132px;height:132px;border-radius:14px;display:grid;place-items:center;border:3px solid transparent;transition:.2s}
.pk-av svg{width:58px;height:58px;stroke:#fff;fill:none;stroke-width:1.6}
.pk-tile:hover{color:#fff}.pk-tile:hover .pk-av{border-color:#fff;transform:scale(1.04)}
.pk-name{font-size:17px;font-weight:600}.pk-sub{font-size:12px;margin-top:-8px;opacity:.7}
.pk-hint{margin-top:44px;color:#5f746e;font-size:12px;text-align:center}
.pw-box{margin-top:32px;background:#0f1f1b;border:1px solid #23413a;border-radius:14px;padding:22px;width:min(340px,100%);text-align:center}
.pw-box h4{color:#fff;font-size:16px;margin-bottom:4px}.pw-box p{color:#8aa39b;font-size:12px;margin-bottom:14px}
.pw-box input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid #2c4c44;background:#06110e;color:#fff;margin-bottom:10px;text-align:center;letter-spacing:.15em}
.pw-row{display:flex;gap:8px}.pw-row button{flex:1}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pw-err{color:#f87171;font-size:12px;min-height:16px}

/* ===== LAYOUT ===== */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
#side{background:var(--side);color:#cfe1db;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#1a1300;font-weight:800}
.logo b{color:#fff;font-size:15px;display:block}.logo small{font-size:11px;color:#7fa69a}
.nav-btn{display:flex;align-items:center;gap:10px;background:none;border:none;color:#b7cdc6;padding:10px 12px;border-radius:9px;text-align:left;font-weight:500;width:100%}
.nav-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.nav-btn:hover{background:#13362f;color:#fff}.nav-btn.on{background:#1b4a40;color:#fff}
.nav-num{margin-left:auto;font-size:11px;opacity:.6}
.side-foot{margin-top:auto;border-top:1px solid #1d3e37;padding-top:14px}
.me{display:flex;gap:10px;align-items:center;padding:0 6px 10px}
.me-av{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.me b{color:#fff;font-size:13px;display:block}.me small{font-size:11px;color:#7fa69a}
.main-wrap{min-width:0}
#top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
#top h1{font-size:19px;font-weight:700}#top p{font-size:12px;color:var(--mut)}
main{padding:24px 28px 60px;max-width:1320px}

/* ===== COMPONENTS ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi small{color:var(--mut);font-size:12px;font-weight:500}.kpi b{display:block;font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.02em}.kpi span{font-size:12px;color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#b9c7c2}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mut)}
.btn.danger{color:var(--red)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.p-grn{background:var(--grnSoft);color:var(--grn)}.p-amb{background:var(--ambSoft);color:var(--amb)}.p-red{background:var(--redSoft);color:var(--red)}.p-blu{background:var(--bluSoft);color:var(--blu)}.p-gry{background:#eef1f0;color:#55635e}.p-vio{background:var(--vioSoft);color:var(--vio)}.p-pri{background:var(--priSoft);color:var(--pri)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;padding:11px 14px;background:#f8faf9;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.click:hover td{background:#f7faf9;cursor:pointer}
.mut{color:var(--mut)}.xs{font-size:12px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);min-width:0}
.toolbar .grow{flex:1;min-width:180px}
.tabs{display:flex;gap:4px;background:#e7ecea;padding:4px;border-radius:11px;width:fit-content;margin-bottom:18px;max-width:100%;overflow-x:auto}
.tab{border:none;background:none;padding:8px 16px;border-radius:8px;font-weight:600;color:var(--mut);white-space:nowrap}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.av{border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;object-fit:cover;overflow:hidden}
.notice{background:var(--priSoft);border:1px solid #bfe0d4;color:#0b4a3c;padding:12px 14px;border-radius:11px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.notice.warn{background:var(--ambSoft);border-color:#f0dca0;color:#6b4806}
.empty{text-align:center;padding:30px;color:var(--mut)}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:24px 0 10px}

/* agency + docs */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.doc{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fbfcfc;display:flex;flex-direction:column;gap:8px}
.doc-h{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.doc-h b{font-size:13px}.doc .fn{font-size:12px;color:var(--mut);word-break:break-all}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.prog{height:6px;background:#e7ecea;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri)}

/* agent cards */
.ag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ag{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s}
.ag:hover{border-color:#a9c4bb;box-shadow:0 4px 14px rgba(14,90,74,.08)}
.ag-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;text-align:center}
.ag-stats div{background:#f5f8f7;border-radius:8px;padding:7px 4px}.ag-stats b{display:block;font-size:17px}.ag-stats small{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.cal .dh{padding:8px;font-size:11px;font-weight:700;color:var(--mut);text-align:center;background:#f8faf9;border-bottom:1px solid var(--line)}
.cal .dc{min-height:92px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;overflow:hidden}
.cal .dc:nth-child(7n){border-right:none}
.cal .dc.off{background:#fafbfb;color:#b5c0bc}.cal .dc.today .dn{background:var(--pri);color:#fff;border-radius:6px;padding:0 6px}
.cal .dc.add:hover{background:#f3f8f6;cursor:pointer}
.dn{font-weight:700;display:inline-block;margin-bottom:4px}
.ev{display:block;font-size:11px;padding:2px 6px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:600;border:none;width:100%;text-align:left}
.up-ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.up-ev:last-child{border:none}
.up-date{width:46px;text-align:center;border-radius:9px;background:var(--priSoft);color:var(--pri);padding:5px 0;flex:none}.up-date b{display:block;font-size:17px;line-height:1.1}.up-date small{font-size:10px;text-transform:uppercase;font-weight:700}

/* programs */
.prg{border-radius:14px;padding:18px;color:#fff;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column}
.prg h4{font-size:17px;margin:8px 0 6px}.prg p{font-size:13px;opacity:.88}
.prg .foot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.prg .tagp{background:rgba(255,255,255,.2);padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;width:fit-content}
.prg .del{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.2);border:none;color:#fff;border-radius:6px;padding:2px 8px}

/* stepper */
.kom{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 4px;position:relative}
.st{text-align:center;position:relative;font-size:11px;color:var(--mut)}
.st::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:3px;background:#e2e8e5;z-index:0}
.st:first-child::before{display:none}
.st.done::before,.st.now::before{background:var(--pri)}
.st .dot{width:28px;height:28px;border-radius:50%;background:#e2e8e5;color:#8a9893;display:grid;place-items:center;margin:0 auto 6px;position:relative;z-index:1;font-weight:700;font-size:12px}
.st.done .dot{background:var(--pri);color:#fff}.st.now .dot{background:#fff;border:3px solid var(--pri);color:var(--pri)}
.st b{display:block;color:var(--ink);font-size:12px}
.cair-box{background:var(--grnSoft);color:#14532d;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}

/* sim */
.sim{display:grid;grid-template-columns:340px 1fr;gap:16px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:12px;font-weight:600;color:var(--mut)}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#eef2f0;border-radius:9px;padding:3px}.seg button{flex:1;border:none;background:none;padding:7px;border-radius:7px;font-weight:600;font-size:12px;color:var(--mut)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--pri)}
.bar-row{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;margin-bottom:8px;font-size:12px}
.bar{height:10px;background:#eef2f0;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:9px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(6,18,15,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal-box{background:#fff;border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-box.sm{width:min(480px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal-head h3{font-size:16px}.modal-head button{border:none;background:#eef2f0;width:30px;height:30px;border-radius:8px;font-size:18px}
#mBody{padding:20px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.preview{background:#f1f4f3;border-radius:10px;padding:10px;text-align:center}
.preview img{max-width:100%;max-height:65vh;border-radius:6px}
.preview iframe{width:100%;height:65vh;border:none;border-radius:6px;background:#fff}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#0b2621;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;transition:.25s;z-index:60;opacity:0}
#toast.on{transform:translateX(-50%);opacity:1}


/* ===== HEATMAP KALENDER ===== */
.hm-card{padding:22px 24px}
.hm-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hm-h{font-size:15px;font-weight:700;margin:0}
.info{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:10px;font-family:'Geist Mono',monospace;color:var(--mut);cursor:help;flex:none}
.hm-ctrl{gap:10px}
.seg2{display:flex;background:#eef1f0;border-radius:10px;padding:3px}
.seg2 button{border:none;background:none;padding:7px 14px;border-radius:8px;font-weight:500;color:var(--mut);font-size:13px;white-space:nowrap}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hm-nav{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.hm-arw{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:15px;line-height:1}
.hm-mon{font-size:17px;min-width:96px;text-align:center}
.hm-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.hm-dh{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut);padding:0 6px 4px;text-transform:uppercase}
.hm-cell{border:1px solid var(--line);border-radius:8px;min-height:94px;padding:8px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:box-shadow .15s}
.hm-cell:hover{box-shadow:0 0 0 2px #b9d9d2}
.hm-cell.after{box-shadow:inset 0 -4px 0 #f6b94a}
.hm-cell.after:hover{box-shadow:inset 0 -4px 0 #f6b94a,0 0 0 2px #b9d9d2}
.hm-cell.today{border:2px solid var(--pri)}
.hm-dn{font-family:'Geist Mono',monospace;font-size:12px;color:#5b6a66}
.hm-val{font-size:11px;color:#3b4a46}.hm-val b{font-size:16px;color:var(--ink);font-family:'Geist Mono',monospace}
.hm-chip{display:block;border:none;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:left;cursor:pointer}
.hm-chip.sm{font-size:10px;padding:1px 6px}
.hm-months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.hm-m{min-height:110px}
.hm-sep{height:1px;background:var(--line);margin:22px 0}
.hm-tbl{border:none;border-radius:0}
.hm-tbl th{background:none;text-transform:none;letter-spacing:0;font-size:12px;font-weight:500}
.hm-tbl td{vertical-align:middle;padding:13px 12px}
.mono{font-family:'Geist Mono',monospace}.r{text-align:right!important}
.up{color:#16a34a;font-weight:700}.down{color:#dc2626;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

/* ===== SPLASH SEGMEN ===== */
#splash{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;cursor:pointer;transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
.sp-bg{position:absolute;inset:0}
.sp-ico{position:absolute;right:-60px;bottom:-60px;width:min(520px,70vw);height:min(520px,70vw);opacity:.12;animation:spRot 6s ease-out forwards}
.sp-ico svg{width:100%;height:100%;stroke:#fff;fill:none;stroke-width:.8}
.sp-ring{position:absolute;border:1px solid rgba(255,255,255,.15);border-radius:50%;animation:spPulse 2.6s ease-out forwards}
.sp-ring.r1{width:520px;height:520px;left:-180px;top:-200px}.sp-ring.r2{width:300px;height:300px;left:40%;top:70%}
.sp-inner{position:relative;max-width:820px;width:100%;padding:24px 28px}
.sp-inner>*{opacity:0;transform:translateY(18px);animation:spUp .6s cubic-bezier(.2,.8,.2,1) forwards}
.sp-inner>*:nth-child(2){animation-delay:.08s}.sp-inner>*:nth-child(3){animation-delay:.16s}.sp-inner>*:nth-child(4){animation-delay:.26s}.sp-inner>*:nth-child(5){animation-delay:.36s}
.sp-k{font-family:'Geist Mono',monospace;font-size:13px;letter-spacing:.28em;opacity:.75}
.sp-k b{color:#f6d36b;font-weight:600}
.sp-title{font-size:clamp(38px,7.5vw,78px);font-weight:800;line-height:1;margin:16px 0 14px;letter-spacing:-.03em}
.sp-desc{font-size:clamp(14px,1.6vw,17px);opacity:.85;max-width:560px}
.sp-stats{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.sp-stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 18px;min-width:140px;backdrop-filter:blur(4px)}
.sp-stat b{display:block;font-size:26px;font-family:'Geist Mono',monospace;font-weight:600}.sp-stat small{font-size:12px;opacity:.75}
.sp-foot{display:flex;align-items:center;gap:14px;margin-top:38px;font-size:12px;opacity:.7}
.sp-bar{height:3px;width:160px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:#fff;animation:spBar 2.6s linear forwards}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spBar{to{width:100%}}
@keyframes spRot{from{transform:rotate(-12deg) scale(.9)}to{transform:rotate(0) scale(1)}}
@keyframes spPulse{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.sp-inner>*,.sp-ico,.sp-ring{animation-duration:.01s}}
.pk-logo{color:#fff;font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.03em;margin-bottom:4px}.pk-logo span,.logo b span,.hero-logo span{color:#f6c343;font-style:italic;padding-right:.06em}

@media (max-width:820px){
 .hm-card{padding:16px}.hm-grid{gap:4px}.hm-cell{min-height:60px;padding:4px;border-radius:6px}
 .hm-val span{display:none}.hm-val b{font-size:13px}.hm-chip{font-size:9px;padding:1px 3px}

const KEY='poparkner_proto_v3';
let DB; try { DB = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if(!DB || DB.v!==3) DB = seed();
/* ---------- BACKEND: Google Sheet + Apps Script ---------- */
const DEFAULT_API_URL = '';   // opsional: tempel URL Web App Apps Script di sini agar semua pengguna langsung terhubung
let API_URL = DEFAULT_API_URL; try { API_URL = localStorage.getItem('poparkner_api') ?? DEFAULT_API_URL; } catch(e){}
const LIVE = () => !!API_URL;
let TOKEN = null; try { TOKEN = sessionStorage.getItem('poparkner_token'); } catch(e){}
let SESSION = null;
function busy(on, t){ $('#busy').hidden=!on; if(t) $('#busyT').textContent=t; }
async function api(action, payload={}, url){
  const res = await fetch(url||API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, token:TOKEN, ...payload})});
  let j; try { j = await res.json(); } catch(e){ throw new Error('Respon server tidak valid — cek URL Web App'); }
  if(!j.ok){ if(j.code==='AUTH' && action!=='login'){ toast(j.error); setTimeout(()=>logout(true),800); } throw new Error(j.error||'Gagal'); }
  return j.data;
}
function normalize(d){
  const o={}; ['agencies','agents','visits','events','programs','bichecks','komisi'].forEach(c=>o[c]=Array.isArray(d[c])?d[c]:[]);
  o.agencies.forEach(a=>{ a.docs=a.docs||{}; DOCS.forEach(x=>{ if(!a.docs[x.k]) a.docs[x.k]={file:null,status:'kosong',note:''}; }); });
  return o;
}
async function loadData(){ const r=await api('bootstrap'); DB=normalize(r.data); return r.user; }
async function reload(){ if(!LIVE()) return; try{ busy(true,'Sinkron data…'); await loadData(); render(); toast('Data tersinkron'); }catch(e){ toast('Gagal sinkron: '+e.message); } finally{ busy(false); } }
const pack = o => JSON.parse(JSON.stringify(o, (k,v)=> (k==='data' && typeof v==='string' && v.startsWith('data:') && v.length>60000) ? undefined : v));
async function commit(col, obj){
  save(); if(!LIVE()) return;
  try { const r=await api('upsert',{col,row:pack(obj)}); const i=DB[col].findIndex(x=>x.id===r.id); if(i>=0) DB[col][i]=Object.assign(DB[col][i],r); }
  catch(e){ toast('Gagal simpan ke Sheet: '+e.message); await reload(); }
}
async function removeRow(col,id){ save(); if(!LIVE()) return; try{ await api('remove',{col,id}); }catch(e){ toast('Gagal hapus: '+e.message); await reload(); } }
function resizeImg(src, max=240){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; im.onerror=()=>res(src); im.src=src; }); }
async function importSample(){
  if(!confirm('Isi Google Sheet dengan data contoh? Data yang sudah ada di Sheet akan DITIMPA.')) return;
  try{ busy(true,'Mengirim data contoh ke Sheet…'); await api('importAll',{data:seed()}); await loadData(); render(); toast('Data contoh tersimpan di Sheet'); }
  catch(e){ toast('Gagal: '+e.message); } finally{ busy(false); }
}
function connForm(){
  openModal('Koneksi Google Sheet', `<p class="xs mut" style="margin-bottom:12px">Tempel URL Web App dari Apps Script (berakhiran <b>/exec</b>). Kosongkan untuk kembali ke mode lokal (data hanya di browser ini).</p>
  <div class="fld"><label>URL Web App</label><input id="fApi" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(API_URL)}"></div>
  <div class="xs" id="apiMsg" style="min-height:18px"></div>
  <div class="m-foot"><button class="btn" onclick="testApi()">Tes koneksi</button><button class="btn pri" onclick="saveApi()">Simpan</button></div>`, true);
}
async function testApi(){ const u=val('fApi'), m=$('#apiMsg'); if(!u) return m.textContent='Isi URL dulu';
  m.textContent='Menghubungi…'; try{ await api('ping',{},u); m.innerHTML='<span style="color:var(--grn)">✅ Terhubung ke backend Poparkner</span>'; }catch(e){ m.innerHTML=`<span style="color:var(--red)">❌ ${esc(e.message)}</span>`; } }
function saveApi(){ API_URL=val('fApi'); try{ localStorage.setItem('poparkner_api',API_URL); }catch(e){} TOKEN=null; try{sessionStorage.removeItem('poparkner_token');}catch(e){} closeModal(); renderPicker(); toast(API_URL?'Mode Google Sheet aktif':'Mode lokal aktif'); }

function save(){ if(LIVE()) return; try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){ toast('File terlalu besar untuk disimpan permanen di prototype'); } }
function resetData(){ if(LIVE()) return reload(); if(confirm('Reset semua data ke data dummy awal?')){ DB=seed(); save(); render(); toast('Data direset'); } }

/* ---------- SESSION / ACCESS ---------- */
let ROLE = null;
let ST = {view:'home', akt:'kalender', bnk:'bi', hmMode:'harian', metric:'visit', win:7, calY:TODAY.getFullYear(), calM:TODAY.getMonth(), sim:{mode:'kpr',price:1200000000,dp:20,tenor:15,bank:'BCA',disc:5,cicil:24}, f:{}};
const R = () => SESSION || ROLES[ROLE];
const agentById = id => DB.agents.find(a=>a.id===id);
const agencyById = id => DB.agencies.find(a=>a.id===id);
const agencyOf = agentId => agencyById((agentById(agentId)||{}).agency);

function vAgencies(){ if(ROLE==='agentco') return DB.agencies; if(ROLE==='principal') return DB.agencies.filter(a=>a.id===R().agency); return []; }
function vAgents(){ if(ROLE==='agentco') return DB.agents; if(ROLE==='principal') return DB.agents.filter(a=>a.agency===R().agency); if(ROLE==='sales') return DB.agents.filter(a=>a.id===R().agent); return []; }
const vAgentIds = () => new Set(vAgents().map(a=>a.id));
/* Bank hanya melihat konsumen yang pernah diajukan BI checking ke bank tersebut */
const bankCons = () => new Set(DB.bichecks.filter(b=>b.bank===R().bank).map(b=>b.consumer));
const vVisits = () => { if(ROLE==='bank'){ const c=bankCons(); return DB.visits.filter(v=>c.has(v.consumer)); } const s=vAgentIds(); return DB.visits.filter(v=>s.has(v.agent)); };
const vKomisi = () => { if(ROLE==='bank'){ const c=bankCons(); return DB.komisi.filter(k=>c.has(k.consumer)); } const s=vAgentIds(); return DB.komisi.filter(k=>s.has(k.agent)); };
function vBI(){ if(ROLE==='bank') return DB.bichecks.filter(b=>b.bank===R().bank); const s=vAgentIds(); return DB.bichecks.filter(b=>s.has(b.agent)); }
const canAdmin = () => ROLE==='agentco';

const NAV = {
  agentco:['home','mou','agent','aktivitas','bank','komisi'],
  principal:['home','mou','agent','aktivitas','bank','komisi'],
  sales:['home','agent','aktivitas','bank','komisi'],
  bank:['home','aktivitas','bank']
};
const NAV_LBL = {home:'Ringkasan',mou:'MOU Kerjasama',agent:'Data Agent',aktivitas:'Aktivitas',bank:'Bank Rekanan',komisi:'Pencairan Komisi'};
const NAV_ICO = {home:'home',mou:'mou',agent:'agent',aktivitas:'aktivitas',bank:'bank',komisi:'komisi'};
const navLabel = k => (ROLE==='sales' && k==='agent') ? 'Profil & Konsumen' : NAV_LBL[k];

/* ---------- PICKER ---------- */
function renderPicker(sel){
  const tiles = Object.entries(ROLES).map(([k,r])=>`
    <button class="pk-tile" onclick="renderPicker('${k}')">
      <div class="pk-av" style="background:${r.color}${sel===k?';border-color:#fff':''}">${ico(r.icon)}</div>
      <div class="pk-name">${r.label}</div><div class="pk-sub">${r.sub}</div>
    </button>`).join('');
  const pw = sel ? `
    <div class="pw-box" id="pwBox">
      <h4>Masuk sebagai ${ROLES[sel].label}</h4><p>${ROLES[sel].sub}</p>
      ${LIVE()?`<input id="unIn" placeholder="Username" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('pwIn').focus()">`:''}
      <input id="pwIn" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin('${sel}')">
      <div class="pw-err" id="pwErr"></div>
      <div class="pw-row"><button class="btn" onclick="renderPicker()">Batal</button><button class="btn pri" onclick="doLogin('${sel}')">Masuk</button></div>
    </div>` : '';
  $('#picker').innerHTML = `
    <div class="pk-logo">Po<span>parkner</span></div><div class="pk-brand">Agent Co · Podomoro Park Bandung</div>
    <div class="pk-title">Kamu masuk sebagai siapa?</div>
    <div class="pk-grid">${tiles}</div>${pw}
    <button class="pk-conn" onclick="connForm()"><i class="ldot ${LIVE()?'on':''}"></i>${LIVE()?'Terhubung ke Google Sheet':'Mode lokal · Hubungkan Google Sheet'}</button>
    <div class="pk-hint" style="margin-top:18px">${LIVE()?'Akun demo: agentco · principal.raywhite · sales.rina · bank.bca (password sama seperti mode lokal)':'Mode lokal · password demo: agentco123 · principal123 · sales123 · bank123'}</div>`;
  if(sel) setTimeout(()=>{const i=$(LIVE()?'#unIn':'#pwIn');if(i)i.focus();},30);
}
function loginFail(m){ $('#pwErr').textContent=m; const b=$('#pwBox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
function enterApp(intro){ ST.view = NAV[ROLE][0]; ST.f={}; $('#picker').hidden=true; $('#app').hidden=false; render(); if(intro){ if(ST.view==='home') showIntro(); else showSplash(ST.view); } }
function setSession(u){ SESSION = Object.assign({}, ROLES[u.role], {agency:'',agent:'',bank:''}, u); ROLE = u.role; }
async function doLogin(k){
  if(LIVE()){
    try{
      busy(true,'Masuk…');
      const r = await api('login',{username:val('unIn'),password:$('#pwIn').value,role:k});
      TOKEN=r.token; try{sessionStorage.setItem('poparkner_token',TOKEN);}catch(e){}
      setSession(r.user); busy(true,'Memuat data dari Google Sheet…'); await loadData();
      busy(false); enterApp(true);
    }catch(e){ busy(false); loginFail(e.message); }
    return;
  }
  if($('#pwIn').value === ROLES[k].pw){
    ROLE=k; SESSION=null; try{sessionStorage.setItem('agentco_role',k);}catch(e){}
    enterApp(true);
  } else loginFail('Password salah');
}
function logout(silent){
  if(LIVE() && TOKEN && silent!==true) api('logout').catch(()=>{});
  ROLE=null; SESSION=null; TOKEN=null; try{sessionStorage.removeItem('agentco_role');sessionStorage.removeItem('poparkner_token');}catch(e){}
  $('#app').hidden=true; $('#picker').hidden=false; renderPicker();
}

/* ---------- MODAL / TOAST ---------- */
function openModal(title, html, small){ $('#mTitle').textContent=title; $('#mBody').innerHTML=html; $('#mBox').className='modal-box'+(small?' sm':''); $('#modal').hidden=false; }
function closeModal(){ $('#modal').hidden=true; $('#mBody').innerHTML=''; }
let tT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('on'),2200); }
const val = id => { const e=document.getElementById(id); return e ? e.value.trim() : ''; };
function readFile(input){ return new Promise((res,rej)=>{ const f=input.files&&input.files[0]; if(!f) return res(null); if(f.size>(LIVE()?10:4)*1024*1024){ toast('Maks. '+(LIVE()?10:4)+' MB per file'); return res(null);} const r=new FileReader(); r.onload=()=>res({name:f.name,type:f.type,data:r.result,at:TODAY_ISO}); r.onerror=rej; r.readAsDataURL(f); }); }

/* ---------- SMALL RENDER HELPERS ---------- */
const COLORS=['#0e5a4a','#1d4ed8','#b7791f','#6d28d9','#c2410c','#0f766e','#be185d'];
function av(a, s=44){ if(!a) return ''; if(a.photo) return `<img class="av" src="${a.photo}" style="width:${s}px;height:${s}px" alt="">`; const ini=a.name.split(' ').map(w=>w[0]).slice(0,2).join(''); const c=COLORS[[...a.id].reduce((x,ch)=>x+ch.charCodeAt(0),0)%COLORS.length]; return `<div class="av" style="width:${s}px;height:${s}px;background:${c};font-size:${s*.36}px">${ini}</div>`; }
const pill = (t,c) => `<span class="pill ${c}">${esc(t)}</span>`;
const leadPill = s => pill(s, LEAD_PILL[s]||'p-gry');
function fuCell(d){ if(!d) return '<span class="mut">–</span>'; const n=daysTo(d); if(n<0) return `<span class="pill p-red">Terlewat ${-n} hr</span>`; if(n===0) return `<span class="pill p-amb">Hari ini</span>`; return `<span class="xs">${fmtDs(d)}</span> <span class="mut xs">(${n} hr)</span>`; }
const opts = (arr, sel) => arr.map(o => { const [v,l] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`; }).join('');

      <div class="hero-hi">Halo, <b>${esc(R().sub)}</b> · ${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
      <div><button class="hero-cta" onclick="document.getElementById('homeBody').scrollIntoView({behavior:'smooth'})">Lihat dashboard ↓</button></div>
    </div>
    <div class="hero-img"><img src="${TEAM_IMG}" alt="Tim Agent Relation Podomoro Park"></div>
    <button class="hero-scroll" onclick="document.getElementById('homeBody').scrollIntoView({behavior:'smooth'})"><span>Scroll</span><i>⌄</i></button>
  </section>`;
  return {t:'Ringkasan', s:'', h: hero + `<div class="home-body" id="homeBody">
    <div class="grid g4">${k4.map(k=>`<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b><span>${k[2]}</span></div>`).join('')}</div>
    <div class="grid g2" style="margin-top:16px">
      ${ROLE==='bank'?bankTodo():`<div class="card"><h3>Follow-up perlu dikerjakan <button class="btn sm" onclick="ST.akt='visit';go('aktivitas')">Lihat tracker</button></h3>

function bankTodo(){
  const list=vBI().filter(b=>b.status!=='Selesai').sort((a,b)=>a.date.localeCompare(b.date));

function bankStatusCard(){
  const v=vVisits(), c={}; v.forEach(x=>c[x.cluster]=(c[x.cluster]||0)+1);
  const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]), mx=Math.max(1,...rows.map(r=>r[1]));
  return `<div class="card"><h3>Minat cluster konsumen Anda</h3>${rows.map(([k,n])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar"><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`).join('')||'<div class="empty">Belum ada data</div>'}</div>`;

function upEv(e){ const d=new Date(e.date+'T00:00'); const c=evColor(e.cat); return `<div class="up-ev"><div class="up-date" style="background:${c}1f;color:${c}"><b>${d.getDate()}</b><small>${d.toLocaleDateString('id-ID',{month:'short'})}</small></div><div><b>${esc(e.title)}</b><div class="xs mut">${esc(e.loc)}${e.end?` · s.d. ${fmtDs(e.end)}`:''}</div>${pill(e.cat,'p-gry')}</div></div>`; }

/* ========================= 1. MOU ========================= */
function agencyStatus(a){
  const req = DOCS.filter(d=>d.req).map(d=>a.docs[d.k]);
  if(req.every(x=>x.status==='ok')) return ['Aktif','p-grn'];
  if(Object.values(a.docs).some(x=>x.status==='revisi')) return ['Perlu Revisi','p-red'];
  if(req.every(x=>x.file)) return ['Menunggu Review','p-amb'];
  if(Object.values(a.docs).some(x=>x.status==='pending')) return ['Dokumen Belum Lengkap','p-blu'];
  return ['Belum Upload','p-gry'];
}
const docCount = a => DOCS.filter(d=>d.req && a.docs[d.k].file).length;
const DOC_PILL = {kosong:['Belum upload','p-gry'],pending:['Menunggu review','p-amb'],ok:['Disetujui','p-grn'],revisi:['Revisi','p-red']};
function docGrid(a){
  const up = ROLE==='principal', rev = canAdmin();
  return `<div class="doc-grid">${DOCS.map(d=>{ const x=a.docs[d.k]; const p=DOC_PILL[x.status];
    return `<div class="doc"><div class="doc-h"><b>${d.l}${d.req?'':' <span class="mut xs">(bila ada)</span>'}</b>${pill(p[0],p[1])}</div>
      <div class="fn">${x.file?`📎 ${esc(x.file.name)}<br><span class="mut">diupload ${fmtD(x.file.at)}</span>`:'Belum ada file'}</div>
      ${x.note?`<div class="xs" style="color:var(--red)">Catatan: ${esc(x.note)}</div>`:''}
      <div class="acts">
        ${x.file?`<button class="btn sm" onclick="previewDoc('${a.id}','${d.k}')">Preview</button>`:''}
        ${up && x.status!=='ok'?`<label class="btn sm pri">${x.file?'Ganti':'Upload'}<input type="file" accept="image/*,application/pdf" hidden onchange="uploadDoc('${a.id}','${d.k}',this)"></label>`:''}
        ${rev && x.file && x.status!=='ok'?`<button class="btn sm pri" onclick="reviewDoc('${a.id}','${d.k}','ok')">Setujui</button><button class="btn sm danger" onclick="revisiDoc('${a.id}','${d.k}')">Revisi</button>`:''}
        ${rev && x.status==='ok'?`<button class="btn sm ghost" onclick="reviewDoc('${a.id}','${d.k}','pending')">Batalkan</button>`:''}
      </div></div>`;}).join('')}</div>`;
}

function agencyDetail(id){ const a=agencyById(id); const s=agencyStatus(a);
  openModal(a.name, `<div class="row between wrap" style="margin-bottom:16px"><div class="xs mut">${esc(a.office)}<br>Principal: <b>${esc(a.principal)}</b> · ${esc(a.phone)} · ${esc(a.email)}</div>${pill(s[0],s[1])}</div>${docGrid(a)}
  <div class="section-title">Agent terdaftar dari kantor ini</div>${DB.agents.filter(x=>x.agency===id).map(x=>`<div class="row" style="margin-bottom:8px">${av(x,32)}<div><b>${esc(x.name)}</b><div class="xs mut">${esc(x.phone)}</div></div></div>`).join('')||'<div class="mut xs">Belum ada</div>'}`);
}
async function uploadDoc(aid,k,input){ const f=await readFile(input); if(!f) return;
  if(LIVE()){ try{ busy(true,'Mengunggah ke Google Drive…'); const g=await api('uploadDoc',{agencyId:aid,key:k,name:f.name,type:f.type,data:f.data}); const i=DB.agencies.findIndex(x=>x.id===aid); DB.agencies[i]=normalize({agencies:[g]}).agencies[0]; DB.agencies[i].docs[k].file.data=f.data; }catch(e){ busy(false); return toast('Gagal upload: '+e.message); } busy(false); render(); return toast('Dokumen terupload ke Drive, menunggu review Agent Co'); }
  const d=agencyById(aid).docs[k]; d.file=f; d.status='pending'; d.note=''; save(); render(); toast('Dokumen terupload, menunggu review Agent Co'); }
function reviewDoc(aid,k,s){ const d=agencyById(aid).docs[k]; d.status=s; if(s==='ok') d.note=''; const a=agencyById(aid); if(agencyStatus(a)[0]==='Aktif' && !a.joined) a.joined=TODAY_ISO; commit('agencies',a); render(); if(!$('#modal').hidden) agencyDetail(aid); toast(s==='ok'?'Dokumen disetujui':'Status dikembalikan'); }

function vAkt(){
  const tabs = [['kalender','Kalender Event'],['program','Program Berjalan'],['visit','Tracker Visit Konsumen']];
  const body = {kalender:aktCal, program:aktProgram, visit:aktVisit}[ST.akt]();
  return {t:'Aktivitas', s:'Event, program promo, dan kunjungan konsumen', a:body.a, h:`<div class="tabs">${tabs.map(t=>`<button class="tab ${ST.akt===t[0]?'on':''}" onclick="ST.akt='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${body.h}`};
}
const evColor = c => EV_CAT[c]||EV_CAT.Lainnya;
const addDays = (s,n) => { const x=new Date(s+'T00:00'); x.setDate(x.getDate()+n); return iso(x); };
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtDs2 = s => new Date(s+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'2-digit'});
const heat = (n,max) => n ? `background:rgba(16,140,124,${(.14+.5*n/Math.max(1,max)).toFixed(2)})` : '';
function dayData(){
  const vis={},clo={},val={};
  vVisits().forEach(v=>{ vis[v.date]=(vis[v.date]||0)+1; });
  vKomisi().forEach(k=>{ if(!k.close) return; clo[k.close]=(clo[k.close]||0)+1; val[k.close]=(val[k.close]||0)+k.price; });
  return {vis,clo,val};
}
const inAfter = ds => DB.events.some(e=>{ const end=e.end||e.date; return ds>end && ds<=addDays(end,ST.win); });
const sumRange = (a,b,map) => { let t=0; for(let x=a; x<=b; x=addDays(x,1)) t+=map[x]||0; return t; };
const segBtns = (key,list) => `<div class="seg2">${list.map(([v,l])=>`<button class="${ST[key]===v?'on':''}" onclick="ST.${key}=${typeof v==='number'?v:`'${v}'`};render()">${l}</button>`).join('')}</div>`;

function aktCal(){
  const dd=dayData(), isV=ST.metric==='visit', src=isV?dd.vis:dd.clo, unit=isV?'visit':'unit';
  const head = `<div class="hm-head">
    <div class="row"><h3 class="hm-h">Heatmap ${isV?'visit konsumen':'penjualan'}</h3><span class="info" title="Warna sel makin pekat = makin banyak ${unit} pada hari itu. Klik tanggal untuk detail${canAdmin()?' atau menambah event':''}.">i</span></div>
    <div class="row wrap hm-ctrl">${segBtns('metric',[['visit','Visit'],['closing','Closing']])}${segBtns('hmMode',[['bulanan','Bulanan'],['harian','Harian']])}${canAdmin()?`<button class="btn" onclick="eventForm()">+ Event</button>`:''}<span class="xs mut">Garis kuning = ${ST.win} hari setelah event</span></div></div>`;
  const body = ST.hmMode==='harian' ? hmDaily(dd,src,unit,isV) : hmMonthly(dd,src,unit,isV);
  return {a:'', h:`<div class="card hm-card">${head}${body}<div class="hm-sep"></div>${impactTable(dd)}</div>`};
}
function hmDaily(dd,src,unit,isV){
  const y=ST.calY, m=ST.calM, first=new Date(y,m,1), start=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate();
  const mk=y+'-'+String(m+1).padStart(2,'0');
  let tot=0,other=0,rv=0,max=0;
  for(let d=1;d<=days;d++){ const ds=iso(new Date(y,m,d)), n=src[ds]||0; tot+=n; max=Math.max(max,n); rv+=dd.val[ds]||0; other+=(isV?dd.clo[ds]:dd.vis[ds])||0; }
  const evN=DB.events.filter(e=>e.date.slice(0,7)<=mk && (e.end||e.date).slice(0,7)>=mk).length;
  const sum = isV ? `${tot} visit · ${other} closing · ${evN} event` : `${tot} unit · ${rpS(rv)} · ${evN} event`;
  let cells=['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="hm-dh">${d}</div>`).join('');
  for(let i=0;i<start;i++) cells+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=iso(new Date(y,m,d)), n=src[ds]||0;
    const evs=DB.events.filter(e=>ds>=e.date && ds<=(e.end||e.date));
    cells+=`<div class="hm-cell${inAfter(ds)?' after':''}${ds===TODAY_ISO?' today':''}" style="${heat(n,max)}" onclick="dayClick('${ds}')"><span class="hm-dn">${d}</span>${n?`<div class="hm-val"><b>${n}</b><span> ${unit}</span></div>`:''}${evs.map(e=>`<button class="hm-chip" style="background:${evColor(e.cat)}" title="${esc(e.title)}" onclick="event.stopPropagation();eventDetail('${e.id}')">${esc(e.title)}</button>`).join('')}</div>`;
  }
  const isNow = y===TODAY.getFullYear() && m===TODAY.getMonth();
  return `<div class="hm-nav"><button class="hm-arw" onclick="calNav(-1)">‹</button><b class="hm-mon">${first.toLocaleDateString('id-ID',{month:'short',year:'numeric'})}</b><button class="hm-arw" onclick="calNav(1)">›</button><span class="xs mut">${sum}</span>${isNow?'':`<button class="btn sm ghost" onclick="ST.calY=TODAY.getFullYear();ST.calM=TODAY.getMonth();render()">Bulan ini</button>`}</div>
    <div class="hm-grid">${cells}</div><p class="xs mut" style="margin-top:12px">Klik tanggal untuk ${canAdmin()?'melihat detail atau menambah event':'melihat detail'}.</p>`;
}
function hmMonthly(dd,src,unit,isV){
  const y=ST.calY;
  const t=BULAN.map((_,i)=>{ const mk=y+'-'+String(i+1).padStart(2,'0'); let n=0,v=0; for(const k in src) if(k.slice(0,7)===mk) n+=src[k]; for(const k in dd.val) if(k.slice(0,7)===mk) v+=dd.val[k]; return {n,v,ev:DB.events.filter(e=>e.date.slice(0,7)===mk)}; });
  const max=Math.max(1,...t.map(x=>x.n));
  const sumN=t.reduce((a,x)=>a+x.n,0), sumV=t.reduce((a,x)=>a+x.v,0), sumE=t.reduce((a,x)=>a+x.ev.length,0);
  return `<div class="hm-nav"><button class="hm-arw" onclick="ST.calY--;render()">‹</button><b class="hm-mon">${y}</b><button class="hm-arw" onclick="ST.calY++;render()">›</button><span class="xs mut">${sumN} ${unit}${isV?'':' · '+rpS(sumV)} · ${sumE} event</span></div>
    <div class="hm-months">${t.map((x,i)=>`<div class="hm-cell hm-m${y===TODAY.getFullYear()&&i===TODAY.getMonth()?' today':''}" style="${heat(x.n,max)}" onclick="ST.calM=${i};ST.hmMode='harian';render()"><span class="hm-dn">${BULAN[i]}</span><div class="hm-val"><b>${x.n}</b><span> ${unit}</span></div>${!isV&&x.v?`<div class="xs mut">${rpS(x.v)}</div>`:''}${x.ev.map(e=>`<span class="hm-chip sm" style="background:${evColor(e.cat)}">${esc(e.title)}</span>`).join('')}</div>`).join('')}</div>
    <p class="xs mut" style="margin-top:12px">Klik bulan untuk melihat per hari.</p>`;
}
function dayClick(ds){
  const evs=DB.events.filter(e=>ds>=e.date&&ds<=(e.end||e.date)), vis=vVisits().filter(v=>v.date===ds), clo=vKomisi().filter(k=>k.close===ds);
  if(!evs.length && !vis.length && !clo.length && canAdmin()) return eventForm(ds);
  openModal(new Date(ds+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}), `
    ${evs.length?`<div class="section-title" style="margin-top:0">Event</div>${evs.map(e=>`<div class="row" style="margin-bottom:6px"><button class="hm-chip" style="background:${evColor(e.cat)};width:auto" onclick="eventDetail('${e.id}')">${esc(e.title)}</button><span class="xs mut">${esc(e.loc)}</span></div>`).join('')}`:''}
    <div class="section-title" ${evs.length?'':'style="margin-top:0"'}>Visit konsumen (${vis.length})</div>
    ${vis.length?`<div class="tbl-wrap"><table><tr><th>Konsumen</th><th>Agent</th><th>Minat</th><th>Status</th></tr>${vis.map(v=>`<tr class="click" onclick="visitForm('${v.id}')"><td class="b">${esc(v.consumer)}</td><td class="xs">${esc(agentById(v.agent).name)}</td><td class="xs">${esc(v.cluster)} · ${esc(v.tipe)}</td><td>${leadPill(v.status)}</td></tr>`).join('')}</table></div>`:'<div class="xs mut">Tidak ada visit</div>'}
    <div class="section-title">Closing (${clo.length})</div>
    ${clo.length?`<div class="tbl-wrap"><table><tr><th>Konsumen</th><th>Agent</th><th>Unit</th><th>Harga</th></tr>${clo.map(k=>`<tr><td class="b">${esc(k.consumer)}</td><td class="xs">${esc(agentById(k.agent).name)}</td><td class="xs">${esc(k.cluster)} ${esc(k.unit)}</td><td>${rpS(k.price)}</td></tr>`).join('')}</table></div>`:'<div class="xs mut">Tidak ada closing</div>'}
    ${canAdmin()?`<div class="m-foot" style="margin-top:16px"><button class="btn pri" onclick="eventForm('${ds}')">+ Event di tanggal ini</button></div>`:''}`);
}
function impactTable(dd){
  const w=ST.win, isV=ST.metric==='visit', src=isV?dd.vis:dd.clo, unit=isV?'visit':'unit';
  const list=DB.events.filter(e=>e.date<=TODAY_ISO).sort((a,b)=>b.date.localeCompare(a.date));
  const f2=n=>n.toLocaleString('id-ID',{maximumFractionDigits:2});
  const rows=list.map(e=>{
    const end=e.end||e.date, aEnd=addDays(end,w);
    const before=sumRange(addDays(e.date,-w),addDays(e.date,-1),src), after=sumRange(e.date,aEnd,src);
    const dur=Math.round((new Date(aEnd+'T00:00')-new Date(e.date+'T00:00'))/864e5)+1;
    const rb=before/w, ra=after/dur;
    let ch;
    if(rb===0&&ra===0) ch='<span class="mut b">tetap 0</span>';
    else if(rb===0) ch='<span class="up">naik dari 0</span>';
    else { const p=(ra-rb)/rb*100; ch = p>=0?`<span class="up">↑ ${Math.round(p)}%</span>`:`<span class="down">↓ ${Math.round(-p)}%</span>`; }
    return `<tr><td><div class="row" style="gap:8px"><i class="dot" style="background:${evColor(e.cat)}"></i><b>${esc(e.title)}</b><span class="pill p-gry">${esc(e.cat)}</span>${aEnd>TODAY_ISO?pill('berjalan','p-amb'):''}</div></td>
      <td style="white-space:nowrap">${fmtDs2(e.date)}${e.end?' – '+fmtDs2(e.end):''}</td>
      <td class="r mono">${before} ${unit}</td>
      <td class="r"><span class="mono">${after} ${unit}</span>${isV?'':`<div class="xs mut">${rpS(sumRange(e.date,aEnd,dd.val))}</div>`}</td>
      <td>${ch}<div class="xs mut">${f2(rb)} → ${f2(ra)} ${unit}/hari</div></td>
      <td><div class="row" style="justify-content:flex-end;gap:6px"><button class="btn sm" onclick="eventDetail('${e.id}')">Lihat</button>${canAdmin()?`<button class="btn sm" onclick="eventForm(null,'${e.id}')">Ubah</button>`:''}</div></td></tr>`;
  }).join('');
  return `<div class="hm-head"><div class="row"><h3 class="hm-h">Event & dampak ${isV?'visit':'penjualan'}</h3><span class="info" title="Membandingkan rata-rata ${unit} per hari selama ${w} hari sebelum event dengan selama event + ${w} hari sesudahnya.">i</span></div>
    <div class="row wrap hm-ctrl"><span class="xs mut">${list.length} event tercatat</span>${segBtns('win',[[3,'±3 hari'],[7,'±7 hari'],[14,'±14 hari']])}</div></div>
    <div class="tbl-wrap hm-tbl"><table><tr><th>Event</th><th>Tanggal</th><th class="r">${w} hari sebelum</th><th class="r">Selama + ${w} hari sesudah</th><th>Perubahan / hari</th><th></th></tr>${rows||'<tr><td colspan="6" class="empty">Belum ada event</td></tr>'}</table></div>`;
}

function pmt(rate, n, P){ const r=rate/1200; return r===0 ? P/n : P*r/(1-Math.pow(1+r,-n)); }
function kprCalc(P, b, tenor){
  const n=tenor*12, f=Math.min(b.fixY,tenor)*12, r=b.fix/1200;
  const a1 = pmt(b.fix,n,P);
  const bal = P*Math.pow(1+r,f) - a1*(Math.pow(1+r,f)-1)/r;
  const a2 = n>f ? pmt(b.flt,n-f,bal) : 0;
  return {a1, a2, inc:a1/0.3, total:a1*f + a2*(n-f)};
}

      <p class="xs mut" style="margin-top:8px">⚠️ Suku bunga di atas adalah DATA DUMMY untuk prototype, belum terhubung ke website masing-masing bank. Floating hanya estimasi.</p>`;
  } else if(s.mode==='bertahap'){

function viewKomisi(){

  const canAsk = ROLE==='sales'||ROLE==='principal';
  return {t:'Pencairan Komisi', s:'Tracking komisi per penjualan agent', a:canAsk?`<button class="btn pri" onclick="komForm()">+ Ajukan Komisi</button>`:'', h:`
    <div class="grid g4" style="margin-bottom:16px"><div class="kpi"><small>Total komisi</small><b>${sum(all)}</b><span>${all.length} penjualan</span></div><div class="kpi"><small>Dalam proses</small><b>${sum(s1)}</b><span>${s1.length} menunggu berkas/verifikasi</span></div><div class="kpi"><small>Terjadwal cair</small><b>${sum(s3)}</b><span>${s3.length} sudah diverifikasi SAD</span></div><div class="kpi"><small>Sudah cair</small><b>${sum(s4)}</b><span>${s4.length} transaksi</span></div></div>
    <div class="toolbar">${ROLE!=='sales'?`<select onchange="ST.f.ka=this.value;render()"><option value="">Semua agent</option>${opts(vAgents().map(a=>[a.id,a.name]),f.ka)}</select>`:''}<select onchange="ST.f.ks=this.value;render()"><option value="">Semua tahap</option>${opts(KOM_STEPS.map((l,i)=>[String(i+1),l]),f.ks)}</select></div>
    ${list.map(komCard).join('')||'<div class="empty card">Belum ada data komisi</div>'}`};
}
function komCard(k){
  const a=agentById(k.agent), dates=[k.d1,k.d2,k.d3,k.d4];
  const steps = KOM_STEPS.map((l,i)=>{const n=i+1, cls=k.stage>n||(k.stage===4&&n===4)?'done':k.stage===n?'now':''; return `<div class="st ${cls}"><div class="dot">${cls==='done'?'✓':n}</div><b>${l}</b>${dates[i]?fmtDs(dates[i]):(n===4&&k.cair?'est. '+fmtDs(k.cair):'')}</div>`;}).join('');
  let info='';
  if(k.stage===3){ const n=daysTo(k.cair); info=`<div class="cair-box">📅 Jadwal pencairan: ${fmtD(k.cair)} ${n>0?`· ${n} hari lagi`:n===0?'· hari ini':`· lewat ${-n} hari`}${k.note?` <span class="xs" style="font-weight:500">— ${esc(k.note)}</span>`:''}</div>`; }
  if(k.stage===4) info=`<div class="cair-box">✅ Sudah cair ${fmtD(k.d4)}</div>`;
  let act='';
  if(canAdmin()){
    if(k.stage===1) act=`<button class="btn sm pri" onclick="komStep('${k.id}',2)">Kirim balasan berkas komisi</button>`;
    if(k.stage===2) act=`<button class="btn sm pri" onclick="komVerif('${k.id}')">Verifikasi & jadwalkan cair</button>`;
    if(k.stage===3) act=`<button class="btn sm" onclick="komVerif('${k.id}')">Ubah jadwal</button><button class="btn sm pri" onclick="komStep('${k.id}',4)">Tandai sudah cair</button>`;
  }
  return `<div class="kom"><div class="row between wrap"><div class="row">${av(a,40)}<div><b>${esc(k.consumer)}</b> <span class="mut xs">· ${esc(k.cluster)} ${esc(k.tipe)} · Unit ${esc(k.unit)}</span><div class="xs mut">${esc(a.name)} — ${esc(agencyById(a.agency).name)}</div></div></div>
    <div style="text-align:right"><div class="b" style="font-size:17px">${rp(k.nominal)}</div><div class="xs mut">${k.pct}% × ${rpS(k.price)}</div></div></div>
    <div class="steps">${steps}</div>${info?`<div style="margin-top:12px">${info}</div>`:''}${act?`<div class="row wrap" style="margin-top:12px;justify-content:flex-end">${act}</div>`:''}</div>`;
}
function komStep(id,s){ const k=DB.komisi.find(x=>x.id===id); k.stage=s; k['d'+s]=TODAY_ISO; commit('komisi',k); render(); toast(s===2?'Berkas komisi dikirim ke agent':'Komisi ditandai cair'); }
function komVerif(id){ const k=DB.komisi.find(x=>x.id===id);
  openModal('Verifikasi Pencairan (Sales Admin)', `<p class="xs mut" style="margin-bottom:12px">${esc(k.consumer)} · ${esc(agentById(k.agent).name)} · ${rp(k.nominal)}</p>
  <div class="fld"><label>Tanggal rencana pencairan</label><input id="fK1" type="date" value="${k.cair||D(14)}"></div><div class="fld"><label>Catatan (terlihat oleh agent)</label><textarea id="fK2">${esc(k.note)}</textarea></div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn pri" onclick="saveVerif('${id}')">Simpan verifikasi</button></div>`, true); }
function saveVerif(id){ if(!val('fK1')) return toast('Isi tanggal pencairan'); const k=DB.komisi.find(x=>x.id===id); k.cair=val('fK1'); k.note=val('fK2'); if(k.stage<3){k.stage=3;k.d3=TODAY_ISO;} commit('komisi',k); closeModal(); render(); toast('Jadwal pencairan disimpan'); }
function komForm(){
  const cons = vVisits().filter(v=>v.status==='Booking');
  openModal('Ajukan Nominal Komisi', `<div class="fld"><label>Konsumen (status Booking)</label><select id="fC0" onchange="const v=DB.visits.find(x=>x.id===this.value);if(v){fC1.value=v.consumer;fC3.value=v.cluster;fC4.innerHTML=tipeOpts(v.cluster,v.tipe);fC2.value=v.agent}"><option value="">— pilih / isi manual —</option>${cons.map(v=>`<option value="${v.id}">${esc(v.consumer)} · ${esc(v.cluster)}</option>`).join('')}</select></div>
  <div class="f2"><div class="fld"><label>Nama konsumen</label><input id="fC1"></div><div class="fld"><label>Agent</label><select id="fC2" ${ROLE==='sales'?'disabled':''}>${opts(vAgents().map(a=>[a.id,a.name]),ROLE==='sales'?R().agent:'')}</select></div></div>
  <div class="f2"><div class="fld"><label>Cluster</label><select id="fC3" onchange="fC4.innerHTML=tipeOpts(this.value)">${opts(Object.keys(CLUSTERS))}</select></div><div class="fld"><label>Tipe</label><select id="fC4">${tipeOpts('Alamanda')}</select></div></div>
  <div class="fld"><label>Tanggal closing</label><input id="fCd" type="date" value="${TODAY_ISO}"></div><div class="f2"><div class="fld"><label>Blok / no. unit</label><input id="fC5"></div><div class="fld"><label>Harga jual (Rp)</label><input id="fC6" inputmode="numeric" oninput="fC8.textContent=rp(num(this.value)*(+fC7.value||0)/100)"></div></div>
  <div class="f2"><div class="fld"><label>Komisi (%)</label><input id="fC7" value="2.5" oninput="fC8.textContent=rp(num(fC6.value)*(+this.value||0)/100)"></div><div class="fld"><label>Nominal komisi</label><div class="b" id="fC8" style="padding:9px 0">Rp 0</div></div></div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn pri" onclick="saveKom()">Ajukan</button></div>`, true); }
function saveKom(){ const price=num(val('fC6')), pct=parseFloat(val('fC7').replace(',','.'))||0; if(!val('fC1')||!price) return toast('Konsumen & harga wajib diisi');
  const o={id:uid('K'),agent:ROLE==='sales'?R().agent:val('fC2'),consumer:val('fC1'),cluster:val('fC3'),tipe:val('fC4'),unit:val('fC5'),price,pct,nominal:Math.round(price*pct/100),stage:1,close:val('fCd')||TODAY_ISO,d1:TODAY_ISO,d2:'',d3:'',d4:'',cair:'',note:''}; DB.komisi.push(o); commit('komisi',o); closeModal(); render(); toast('Pengajuan komisi terkirim ke Agent Co'); }


/* ========================= SPLASH SEGMEN ========================= */
const SPLASH = {
  mou:{n:'01',ico:'mou',bg:'linear-gradient(135deg,#04201a 0%,#0e5a4a 55%,#1f8a6e 100%)',d:'Kelengkapan dokumen Perjanjian Jasa Pemasaran setiap agency — upload, review, dan persetujuan dalam satu tempat.'},
  agent:{n:'02',ico:'agent',bg:'linear-gradient(135deg,#081633 0%,#1d4ed8 60%,#3b82f6 100%)',d:'Profil agent properti beserta konsumen yang mereka bawa: minat cluster, tipe, budget, dan jadwal follow-up.'},
  aktivitas:{n:'03',ico:'aktivitas',bg:'linear-gradient(135deg,#331a02 0%,#b45309 55%,#f59e0b 100%)',d:'Heatmap aktivitas, kalender event, program promo yang berjalan, dan tracker kunjungan konsumen.'},
  bank:{n:'04',ico:'bank',bg:'linear-gradient(135deg,#1a0a3d 0%,#6d28d9 60%,#8b5cf6 100%)',d:'BI checking calon konsumen dan simulasi KPR maupun cash dengan bank rekanan Podomoro Park.'},
  komisi:{n:'05',ico:'komisi',bg:'linear-gradient(135deg,#03231a 0%,#15803d 60%,#22c55e 100%)',d:'Tahapan pencairan komisi dari pengajuan nominal sampai dana cair — tidak perlu tanya manual lagi.'}
};
function splashStats(v){
  const m=TODAY_ISO.slice(0,7);
  if(v==='mou'){
    if(ROLE==='principal'){ const a=vAgencies()[0]; return [['Dokumen wajib',docCount(a)+'/5'],['Status',agencyStatus(a)[0]],['Agent terdaftar',DB.agents.filter(x=>x.agency===a.id).length]]; }
    const A=DB.agencies; return [['Agency terdaftar',A.length],['MOU aktif',A.filter(a=>agencyStatus(a)[0]==='Aktif').length],['Perlu ditindak',A.filter(a=>['Menunggu Review','Perlu Revisi'].includes(agencyStatus(a)[0])).length]];
  }
  if(v==='agent'){ const vs=vVisits(); return ROLE==='sales' ? [['Konsumen',vs.length],['Leads Hot',vs.filter(x=>x.status==='Hot').length],['Closing',vKomisi().length]] : [['Agent',vAgents().length],['Total visit',vs.length],['Leads Hot',vs.filter(x=>x.status==='Hot').length]]; }
  if(v==='aktivitas') return [['Event bulan ini',DB.events.filter(e=>e.date.slice(0,7)===m).length],['Program aktif',DB.programs.filter(p=>p.start<=TODAY_ISO&&p.end>=TODAY_ISO).length],['Visit bulan ini',vVisits().filter(x=>x.date.slice(0,7)===m).length]];
  if(v==='bank'){ const b=vBI(); return [['Pengajuan BI checking',b.length],['Belum selesai',b.filter(x=>x.status!=='Selesai').length],['Bank rekanan',BANKS.length]]; }
  if(v==='komisi'){ const k=vKomisi(); return [['Total penjualan',k.length],['Dalam proses',k.filter(x=>x.stage<3).length],['Terjadwal cair',k.filter(x=>x.stage===3).length]]; }
  return [];
}
let spT, spH;
function showSplash(v){
  const s=SPLASH[v], el=$('#splash'); if(!s) return;
  clearTimeout(spT); clearTimeout(spH);
  el.innerHTML = `<div class="sp-bg" style="background:${s.bg}"></div><div class="sp-ring r1"></div><div class="sp-ring r2"></div><div class="sp-ico">${ico(s.ico)}</div>
    <div class="sp-inner"><div class="sp-k">POPARKNER · <b>SEGMEN ${s.n}</b></div><div class="sp-title">${navLabel(v)}</div><p class="sp-desc">${s.d}</p>
    <div class="sp-stats">${splashStats(v).map(x=>`<div class="sp-stat"><b>${esc(x[1])}</b><small>${esc(x[0])}</small></div>`).join('')}</div>
    <div class="sp-foot"><div class="sp-bar"><i></i></div><span>Klik di mana saja untuk lanjut</span></div></div>`;
  el.classList.remove('out'); el.hidden=false;
  spT = setTimeout(hideSplash, 2700);
}
function hideSplash(){ const el=$('#splash'); if(el.hidden) return; clearTimeout(spT); el.classList.add('out'); spH=setTimeout(()=>{ el.hidden=true; el.classList.remove('out'); }, 450); }

/* ---------- INTRO LOGO ---------- */
let inT, inH;
function showIntro(){
  const el=$('#intro'); clearTimeout(inT); clearTimeout(inH);
  el.innerHTML=`<div class="in-glow"></div><div class="in-wrap"><div class="in-logo"><span class="in-po">Po</span><span class="in-pk">parkner</span></div><div class="in-line"></div><div class="in-k">Agent Co · Podomoro Park Bandung</div></div><div class="in-skip">Klik untuk lewati</div>`;
  el.classList.remove('out'); el.hidden=false; window.scrollTo(0,0);
  inT=setTimeout(hideIntro, 2900);
}
function hideIntro(){ const el=$('#intro'); if(el.hidden) return; clearTimeout(inT); el.classList.add('out'); inH=setTimeout(()=>{ el.hidden=true; el.classList.remove('out'); el.innerHTML=''; },600); }

/* ---------- BOOT ---------- */
(async function(){
  if(LIVE()){
    if(TOKEN){ try{ busy(true,'Memuat data dari Google Sheet…'); const u=await loadData(); setSession(u); busy(false); return enterApp(false); }catch(e){ busy(false); TOKEN=null; try{sessionStorage.removeItem('poparkner_token');}catch(_){} } }
    return renderPicker();
  }
  let r=null; try{ r=sessionStorage.getItem('agentco_role'); }catch(e){}
  if(r && ROLES[r]){ ROLE=r; enterApp(false); } else renderPicker();
})();
</script>
